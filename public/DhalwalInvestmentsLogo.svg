<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123A7A"/>
      <stop offset="100%" stop-color="#0A2555"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6B84C"/>
      <stop offset="100%" stop-color="#C99218"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(40 20)">

    <!-- Shield -->
    <path d="M120 10
             L200 55
             L200 170
             C200 230 170 260 120 285
             C70 260 40 230 40 170
             L40 55
             Z"
          fill="none"
          stroke="url(#blue)"
          stroke-width="10"
          stroke-linejoin="round"/>

    <!-- Growth Bars -->
    <rect x="70" y="150" width="24" height="60" rx="4" fill="url(#blue)"/>
    <rect x="105" y="110" width="24" height="100" rx="4" fill="url(#blue)"/>
    <rect x="140" y="70" width="24" height="140" rx="4" fill="url(#blue)"/>

    <!-- Arrow -->
    <path d="M40 210
             C75 245 135 245 185 170"
          fill="none"
          stroke="url(#gold)"
          stroke-width="12"
          stroke-linecap="round"/>

    <polygon points="178,170 198,165 189,145"
             fill="url(#gold)"/>

  </g>

  <!-- Divider -->
  <line x1="320" y1="40" x2="320" y2="280"
        stroke="#D8D8D8"
        stroke-width="2"/>

  <!-- Text -->
  <text x="360"
        y="120"
        font-size="76"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-weight="800"
        fill="#0A2555">
        DHALWAL
  </text>

  <text x="360"
        y="182"
        font-size="46"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-weight="600"
        letter-spacing="8"
        fill="#404040">
        INVESTMENTS
  </text>

  <line x1="360" y1="225" x2="470" y2="225"
        stroke="#D0A032"
        stroke-width="3"/>

  <text x="495"
        y="235"
        font-size="34"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-weight="500"
        fill="#C99218">
        &amp; FINANCES
  </text>

  <line x1="740" y1="225" x2="890" y2="225"
        stroke="#D0A032"
        stroke-width="3"/>

  <text x="360"
        y="275"
        font-size="22"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        letter-spacing="5"
        fill="#666666">
        INVEST • GROW • SECURE
  </text>

</svg>